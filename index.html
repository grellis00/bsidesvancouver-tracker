<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSides Vancouver 2026 — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --surface: #141720;
  --surface2: #1c2130;
  --border: #2a1a2e;
  --accent: #ca0287;
  --accent2: #ff3d6b;
  --accent3: #e066c0;
  --text: #e2e8f0;
  --muted: #7a6b85;
  --saved-bg: #0d2a1e;
  --saved-border: #00c853;

  --type-keynote: #ffd740;
  --type-talk: #00e5ff;
  --type-workshop: #a6ff4d;
  --type-panel: #ce93d8;
  --type-ctf: #ff6e40;
  --type-malware: #ff3d6b;
  --type-movie: #80cbc4;
  --type-other: #90a4ae;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-coin {
  height: 44px;
  width: 44px;
  border-radius: 50%;
  flex-shrink: 0;
}

.logo-wordmark {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.logo-wordmark .l1 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.05em;
  line-height: 1;
}

.logo-wordmark .l2 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.my-schedule-btn {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.my-schedule-btn:hover, .my-schedule-btn.active {
  background: var(--accent);
  color: var(--bg);
}
.my-schedule-btn .count {
  background: var(--accent2);
  color: white;
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 10px;
  margin-left: 6px;
}

/* FILTERS */
.filters {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 180px;
  max-width: 320px;
}

.search-wrap input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 10px 7px 30px;
  border-radius: 3px;
  outline: none;
  transition: border 0.15s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap::before {
  content: '⌕';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
}

.filter-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--text); color: var(--text); }
.pill.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }

/* MAIN */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

/* TIMELINE GROUP */
.time-group { margin-bottom: 28px; }

.time-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.time-label::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

/* SESSION CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid transparent;
  border-radius: 4px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.card:hover { border-color: var(--muted); background: var(--surface2); }
.card.saved {
  background: var(--saved-bg);
  border-color: var(--saved-border);
  border-left-color: var(--saved-border);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.type-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.time-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

.venue-badge {
  font-size: 11px;
  color: var(--muted);
}
.venue-badge::before { content: '📍 '; font-size: 10px; }

.card-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--text);
  flex: 1;
}

.save-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  width: 28px;
  height: 28px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  margin-top: -2px;
}
.save-btn:hover { border-color: var(--accent3); color: var(--accent3); }
.card.saved .save-btn { border-color: var(--saved-border); color: var(--saved-border); background: rgba(0,200,83,0.1); }

.card-speakers {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}
.card-speakers::before { content: '↳ '; }

.card-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-top: 8px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}
.card.expanded .card-desc { max-height: 600px; }

.card-seats {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--accent2);
  margin-top: 4px;
}

/* MY SCHEDULE PANEL */
#my-schedule-panel {
  display: none;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}
#my-schedule-panel.visible { display: block; }

.panel-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .big { font-size: 32px; margin-bottom: 12px; }

/* DATE HEADER */
.date-header {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent3);
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  margin-top: 20px;
}
.date-header:first-child { margin-top: 0; }

/* CONFLICT WARNING */
.conflict-warn {
  background: rgba(255,61,107,0.1);
  border: 1px solid var(--accent2);
  border-radius: 3px;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--accent2);
  margin-bottom: 12px;
  font-family: 'IBM Plex Mono', monospace;
}

/* RESULT COUNT */
.result-info {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 16px;
}

@media (max-width: 600px) {
  .logo { font-size: 13px; }
  .card-title { font-size: 13px; }
  .filters { gap: 6px; }
}
</style>
</head>

<script>
const SESSIONS = [{"id":"26975","title":"Advanced SaaS Threats: Case Studies from the Field","type":"Talk","start":"2026-06-01T10:40:00","end":"2026-06-01T11:30:00","date":"2026-06-01","startTime":"10:40","endTime":"11:30","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Damien Miller-McAndrews","description":"An increasing reliance on SaaS does not always come with the knowledge or motivation needed to secure these services. As businesses move away from on-premise systems, SaaS platforms are increasingly used for business-critical purposes, storing vital, sensitive company information. Organizations continue to underestimate SaaS breach risk, prioritizing ransomware defense while leaving critical SaaS exposures unaddressed.\n\nBut attackers have noticed, and they\u2019re exploiting this blind spot.\n\nThrough a number of real-world case studies, including incidents involving Scattered Spider helpdesk takeovers, Salesforce-connected app compromises, malicious OAuth abuse, and a million-dollar BEC, we\u2019ll dissect each campaign from initial access to root cause.\n\nAttendees will see how these intrusions unfolded across platforms, threat actor groups, and techniques mapped to MITRE ATT&CK. Each case illustrates that SaaS is no longer a peripheral threat vector. It\u2019s an attacker\u2019s playground. You\u2019ll leave with a better understanding of how these breaches occur, what defenders can learn from them, and practical steps to defend against the next wave of SaaS-native attacks.","tags":"","seats":""},{"id":"26980","title":"sudo vibes : How AI Agents Got Root and Nobody Noticed","type":"Talk","start":"2026-06-01T12:10:00","end":"2026-06-01T12:30:00","date":"2026-06-01","startTime":"12:10","endTime":"12:30","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Jake King","description":"Developers are handing AI agents the keys to their build environments. Your peers use Cowork to answer emails. Your parents generate memes from their camera roll. We've let convenience rapidly erode trust and integrity and given AI access through accessibility tools, APIs, and human emulation.\n\nWhen Cowork needs debug access to Chrome and your filesystem, Claude Code runs with your terminal permissions and Cursor installs packages without asking, its a recipe for disaster. The result is a new attack surface spanning hallucinated dependencies, unsigned artifacts, prompt injection through source files, and autonomous agents that can ignore explicit instructions.\n\nIn this talk, Jake will walk through recent breaches, patterns of abuse, and how adversaries are taking advantage of the vibe coded way we build and ship software today.","tags":"","seats":""},{"id":"27022","title":"Trust No Schema: Finding the Truth in Raw SQLite Binary.","type":"Talk","start":"2026-06-01T13:30:00","end":"2026-06-01T14:20:00","date":"2026-06-01","startTime":"13:30","endTime":"14:20","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Marcelo Caiado","description":"In a landscape where digital reality is increasingly \u201coptional,\u201d the structures we rely on, like database schemas, can be deceptive, corrupted, or missing entirely. When the standard query layer fails and SELECT * returns nothing, most analysts assume the truth is gone. This session is for those who refuse to accept that conclusion.\n\nWe will bypass the \"optional reality\" presented by database management tools and descend into the absolute ground truth: the raw binary structure of the SQLite format. By treating the database file not as a structured container but as a raw artifact, we can uncover evidence that standard parsers ignore. We will map out table structures, decode \"Magic Bytes,\" and carve data without ever needing a valid header. This approach allows us to reconstruct the narrative and verify the existence of data, even when the system says it doesn\u2019t exist.","tags":"","seats":""},{"id":"27191","title":"Pragmatic Security to enable safety in the era of AI","type":"Talk","start":"2026-06-01T11:40:00","end":"2026-06-01T12:30:00","date":"2026-06-01","startTime":"11:40","endTime":"12:30","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Michael Argast","description":"Grounded in the experience of supporting over 100 AI frontier firms in their security posture, Michael will cover pragmatic approaches to enable security and safety of your organization in the era of AI.\n\nThis talk will cover in depth, specific recommendations you can use in your organization today in the areas of:\n\nAI Program and Risk Management - how to govern AI adoption and risk at your organization\nEffective defence techniques against undetectable impersonation attacks\n\nDevelopment security - safety, guardrails and techniques to make sure agentic coding doesn't increase your vulnerability risks\n\nVendor risk management and shadow IT - technical and operational solutions to address AI vendor sprawl and risks\n\nAgentic access management - understanding how to leverage permissions and data access controls while enabling agentic workflows","tags":"","seats":""},{"id":"27468","title":"Turning the dial on SAST: Reducing False Positives with Call Graph\u2013Driven LLM Reasoning","type":"Talk","start":"2026-06-01T16:30:00","end":"2026-06-01T17:20:00","date":"2026-06-01","startTime":"16:30","endTime":"17:20","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Iman Sharafaldin; Vrushal Nedungadi","description":"Static analysis tools are an integral part of modern-day software development processes to find bugs and security vulnerabilities. However, they suffer from a drawback: false positive findings. False positives are findings that are incorrectly identified by the static analysis tools as a vulnerability. Such alerts may waste developers' time and effort since these are not exploitable and need no patching. A substantial number of false positives can lead to developer fatigue and reduce the adoption of static analysis tools within software development teams. This may cause real vulnerabilities to go unnoticed, and thereby increasing the software's overall attack surface. Therefore, it is imperative that false positives from SAST findings, and the noise that it creates, be reduced significantly.\n\nIn an attempt to realize this objective, we propose a novel approach that combines inter-procedural call graph analysis with large-language model reasoning to identify false positives in SAST findings. Our approach constructs precise call-graphs with bidirectional execution context (caller chain and callee chain) to help the LLM conduct a comprehensive data flow analysis. To help the LLM reason better, our method guides the LLMs using CWE-specific prompts which drives more accurate results.\n\nThe system detects over 90% false positives for specific CWEs like CWE-22 (Path Traversal) and CWE-89 (SQL Injection). Our research demonstrates that inter-procedural call graph analysis coupled with LLM reasoning powered by CWE-specific prompting can significantly reduce the number of false positives in SAST findings, thereby increasing the usability of SAST tools.","tags":"","seats":""},{"id":"27470","title":"Confessing how to build authentic trust in the age of artificial expertise","type":"Talk","start":"2026-06-01T13:30:00","end":"2026-06-01T13:50:00","date":"2026-06-01","startTime":"13:30","endTime":"13:50","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Noris Buriac","description":"AI has democratized \"expertise.\" Developers are using LLMs to ship complex (and potentially insecure) code at record speeds, while security professionals are using them to generate generic policy bloat. The result? A \"Dead Internet\" corporate culture where nobody trusts anyone, volume replaces value, and friction is at an all-time high.\n\nAs a software engineer turned security advisor, I have lived on both sides of this divide. I used to view security as the \"Department of No\" - a blocker to my velocity. Now, I realize the friction wasn't technical; it was a failure of influence.\n\nThis talk explores why Human Influence is the ultimate security control that AI cannot fake. We will move beyond tricks and focus on authentic engineering alignment. I will share how to cut through the \"AI slop\" to build genuine trust with skepticism-heavy developers, how to translate technical debt into business risk for executives, and how to stop \"generating\" security and start negotiating it.","tags":"","seats":""},{"id":"27959","title":"Hype to Innovation: Quantifying AI Value for the Board","type":"Talk","start":"2026-06-01T10:40:00","end":"2026-06-01T11:30:00","date":"2026-06-01","startTime":"10:40","endTime":"11:30","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Kevin Sahota; Greg Ahira","description":"Boards are being asked to approve major investments in emerging technology. Today it may be AI, tomorrow quantum. Too often these decisions are driven by competitive pressure and promises of innovation, while the cyber implications remain loosely defined or entirely unmeasured. When value, risk, and resilience are not clearly understood, strategic decisions are made on assumptions, placing return on investment at risk.\n\nThis session dives into practical ways to quantify cyber value at the leadership level. The focus is on framing emerging technology through measurable impact, risk exposure, and organizational resilience rather than technical performance. Attendees will leave with concrete methods and insights that support confident executive decision-making.","tags":"","seats":""},{"id":"28101","title":"Behind the CAPTCHA: Exposing ClickFix and FakeCaptcha Threats","type":"Talk","start":"2026-06-01T11:40:00","end":"2026-06-01T12:00:00","date":"2026-06-01","startTime":"11:40","endTime":"12:00","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Greg Leah","description":"ClickFix and FakeCaptcha attacks represent sophisticated social engineering tactics designed to deceive users into performing unintended actions, such as downloading malware or facilitating unauthorized transactions. By exploiting user trust through realistic CAPTCHA prompts or deceptive \"click-to-fix\" scenarios, attackers are able to bypass traditional security defenses, resulting in malware infections, data theft, or financial losses. \n \nThis presentation provides a technical overview of current ClickFix and FakeCaptcha attack methodologies, including the novel \u201cEtherHiding\u201d technique. The talk will walk through analyses of real-world incidents, discuss the variations of FakeCaptcha attacks and outline various payloads as well as present indicators of compromise. Attendees will learn effective detection strategies, proactive prevention techniques leveraging threat intelligence, and practical steps organizations can implement to safeguard users against this evolving cyber threat.","tags":"","seats":""},{"id":"28148","title":"Canada's First Cyber Security Case","type":"Talk","start":"2026-06-01T14:00:00","end":"2026-06-01T14:50:00","date":"2026-06-01","startTime":"14:00","endTime":"14:50","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Cariad Heather Keigher","description":"In 1975, the University of Alberta received its first computer: an Amdahl 470 V/6 complete with three hundred terminals spread across the campus made available to 3,500 students and faculty. While one of the first notable things it was used for was to play chess, it also became important in establishing computer crime law in Canada. When a student was caught stealing time from the shared system, the Crown struggled to charge him. This talk will go over the entire story and how the Supreme Court of Canada had to tell Parliament to change the law to understand the new frontier that was computing.","tags":"","seats":""},{"id":"28251","title":"Self-Infected Prompt Kiddies: From Script Kiddies to Prompt Kiddies \u2014 AI-Powered Cybercrime in the Wild","type":"Talk","start":"2026-06-01T11:40:00","end":"2026-06-01T12:30:00","date":"2026-06-01","startTime":"11:40","endTime":"12:30","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Ali Alame","description":"In the age of AI, truth is becoming optional, and cybercriminals are taking full advantage.\nToday\u2019s threat actors aren\u2019t just buying phishing kits and reusing old malware. They are actively using AI to write convincing lures, generate malicious code, troubleshoot payloads, translate scams into multiple languages, and rapidly iterate campaigns like a software development team.\nThis talk provides a behind-the-scenes look at what defenders rarely get to see: pre-breach threat intelligence artifacts collected from real-world criminal testing environments. Many attackers test their malware and phishing infrastructure before launching full campaigns, and those \u201ctrial runs\u201d often leak into places where defenders can collect and analyze them.\nWe will walk through real-world examples of:\n\n\u2022 AI-generated phishing emails, landing pages, and social engineering scripts\u2022 Infostealer malware development patterns that strongly suggest LLM involvement\u2022 Prompt-driven iteration: how criminals \u201cdebug\u201d scams and malware faster than ever\u2022 The fingerprints AI leaves behind in code, wording, structure, and infrastructure\u2022 What this shift means for detection, threat hunting, and incident response\u2022 \nAs machine-generated content floods the internet, scams become harder to distinguish from legitimate communication, and malware becomes easier to produce than ever before.\n\nThis session highlights the uncomfortable reality defenders now face: attackers don\u2019t need advanced skills anymore, they just need the right prompt.","tags":"","seats":""},{"id":"28277","title":"Threat Modeling Developer Behaviour: The Psychology of Bad Code","type":"Talk","start":"2026-06-01T13:30:00","end":"2026-06-01T14:20:00","date":"2026-06-01","startTime":"13:30","endTime":"14:20","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Tanya Janca","description":"Security teams threat model systems, but rarely do we threat model the developers building them. What if some of the most persistent AppSec problems aren\u2019t purely technical\u2014but behavioral?\n\nThis talk dives into the psychology of insecure code, using principles from behavioral economics to explain why developers take risky shortcuts, ignore secure practices, or ship code that \u201cjust vibes.\u201d From copying insecure Stack Overflow snippets, to skipping documentation, to shipping untested features under tight deadlines\u2014these aren\u2019t personal failings. They\u2019re predictable cognitive patterns influenced by incentives, stress, and how our brains are wired.\n\nWe\u2019ll explore how well-known concepts such as present bias, automation bias, the bystander effect, and overconfidence play out in real-world development. Then we\u2019ll shift from insight to action\u2014offering behavioral nudges and design patterns you can apply in your SDLC, tools, and team culture to make secure behavior the default.\n\nThis talk blends psychology, security, and dev reality to reframe AppSec\u2014not as a checklist, but as a human system.","tags":"","seats":""},{"id":"28313","title":"The Heartbeat is Lying: Proving Physical Truth in a Spoofed OT Network","type":"Talk","start":"2026-06-01T16:30:00","end":"2026-06-01T17:20:00","date":"2026-06-01","startTime":"16:30","endTime":"17:20","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Parisa Saqib","description":"In any complex environment where industrial systems and traditional IT networks meet, we rely on digital signals to tell us the status of physical hardware. We trust our security dashboards to show that a system is running within safe parameters, essentially treating the digital display as the absolute truth. However, as these systems become more integrated, a new challenge emerges where the digital reality becomes optional. Attackers have shifted from simply breaking things to manipulating the very data we use to monitor them. By interfering with communication protocols, a compromised system can be coached to report a perfectly healthy heartbeat to the security team even while the physical equipment is being tampered with in the background.\n\nThis session explores the lifecycle of these integrity attacks and how an analyst can spot a lie told by a machine. We will look at how automated status checks are hijacked and discuss the forensic mindset needed to identify the gap between what the network reports and what the hardware is actually doing. By moving away from a total reliance on digital dashboards and focusing on forensic verification, we can better secure environments that mix legacy hardware with modern connectivity. This talk is designed to be accessible for students and practitioners alike, focusing on investigative logic and the reality of securing modern infrastructure without getting lost in vendor jargon.","tags":"","seats":""},{"id":"28638","title":"Follow the Engineer: Delivering Security Intelligence Over MCP","type":"Talk","start":"2026-06-01T16:00:00","end":"2026-06-01T16:20:00","date":"2026-06-01","startTime":"16:00","endTime":"16:20","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Ankit Kumar","description":"Open source runs the world. AI now ships most of the code. That means security decisions are happening inside the tools engineers already use, not in dashboards or tickets. The problem is no longer finding vulnerabilities. It is delivering the right remediation guidance at the exact moment an engineer can act.\n\nThis talk is a field report from building open patterns for that delivery. We built OVRSE, an open remediation specification, and a community MCP server that brings exploitability, breaking change risk, patch stability signals, and remediation commands directly into the AI tools engineers already use. It worked. It also broke in surprising ways.\n\nYou will see why tool prompt instructions became security controls, why structured output replaced dashboards as the interface between security and engineering, and why MCP adoption created a governance gap most security teams have not noticed yet.\n\nThis is not a product talk. It is a practitioner report on how the delivery layer for security intelligence is changing, and what the community needs to do about it.","tags":"","seats":""},{"id":"28862","title":"Adapt Your IR for AI","type":"Talk","start":"2026-06-01T10:40:00","end":"2026-06-01T11:00:00","date":"2026-06-01","startTime":"10:40","endTime":"11:00","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Ryan Clarke; Muhammad Muneer","description":"The 2026 BSides Vancouver theme perfectly captures the current state of enterprise security. As organizations rapidly adopt AI capabilities, the attack surface has expanded far beyond simple chat interfaces and into the core of how businesses operate. Security operations teams are now tasked with defending a complex, multi-layered AI ecosystem, often without the necessary visibility, standardized tooling, or established playbooks.\nThis presentation moves past the hype to break down the practical realities of Incident Response (IR) across the complete AI architecture. We will explore the specific threats, telemetry blind spots, and triage strategies associated with four distinct pillars of enterprise AI adoption:\n\u2022 The AI Pipeline & MLOps: Defending the supply chain. \u2022 Locally Hosted AI Applications: The unique IR challenges of managing self-hosted open-source models. \u2022 Agentic Workflows: Triaging incidents when autonomous systems go off the rails. \u2022 Widespread LLM Usage: Managing the daily operational risks of enterprise LLM adoption, from analysts without Pandas familiarity using LLMs to generate Python code for Jupyter notebooks, to standard prompt injection and data leakage in corporate applications.Attendees will leave with a pragmatic framework for adapting their current IR capabilities to this new reality. We will outline actionable steps to update response playbooks for AI systems and build the necessary cross-functional workflows between security, data science, and engineering.","tags":"","seats":""},{"id":"28933","title":"Finding Public Files\u2026 That Were Never Meant to Be Public","type":"Talk","start":"2026-06-01T14:30:00","end":"2026-06-01T15:20:00","date":"2026-06-01","startTime":"14:30","endTime":"15:20","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Ionatan Waisgluss","description":"What if your most sensitive information wasn\u2019t hacked, stolen, or exfiltrated\u2014but quietly made public through everyday business processes? This talk examines how sensitive files routinely escape into the public eye via search engines, file-hosting platforms, misconfigured cloud services, shared drives and servers, URL shorteners, forgotten upload paths, and other overlooked exposure points\u2014often without triggering alerts or raising suspicion.\n\nDrawing on experience in cybersecurity, information privacy, and private investigations, this session explores how attackers, journalists, and investigators systematically uncover sensitive data by pivoting across people, companies, domains, filenames, usernames, and keywords. Using nothing more exotic than internet search engines, specialized file-discovery tools, and an understanding of human error, this is a practical, reconnaissance-focused talk about finding what was \u201cnever meant to be public,\u201d why these leaks are so persistent, and how defenders can identify and reduce this exposure before someone else does.","tags":"","seats":""},{"id":"29066","title":"Why NIST Maturity Score May Mislead You (Is it budget well-spent to repeat your NIST assessment annually in the age of AI?)","type":"Talk","start":"2026-06-01T15:00:00","end":"2026-06-01T15:20:00","date":"2026-06-01","startTime":"15:00","endTime":"15:20","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Golnaz Elahi","description":"Cybersecurity maturity scores, frequently presented to executive leadership and boards, are often tied to the National Institute of Standards and Technology (NIST) framework and the Capability Maturity Model Integration (CMMI) scale. Organizations often use these scores\u2014sometimes oddly accurate as 2.59 moving to precisely 2.73 \u2014as a definitive stamp of achievement. The pursuit of external validation drives many leaders to also seek industry benchmarks for comparison. This paper argues that relying on these static, quantified scores can be profoundly misleading, potentially instilling a false sense of security and misdirecting budget and resource allocation.\n\nThe concept of a numerical maturity score applied to NIST is not inherent to the framework itself; rather, it is a construct developed and popularized by consulting companies, often blending NIST's Implementation Tiers\u2014which are focused on risk management\u2014with the CMMI scale. This imposition of a single number fails to capture the true complexity of cybersecurity risk management.\n\nThis presentation invites the audience to take these scores with a grain of salt due to significant limitations in both the assessment methodologies and the resulting benchmarks:\n\u2022 Risk Alignment Failure: The final score does not accurately reflect the organization's unique threat profile, actual risk exposure, or the criticality of the assets being protected. This means a high score provides no guarantee of protection against the most relevant threats.\u2022 Focus on Design over Operational Effectiveness: Assessments focus predominantly on control design and documented capability\u2014a paper-based review or interview\u2014rather than validating operational effectiveness through active, continuous testing and real-world validation.\u2022 Subjectivity and Measurement Bias: Despite following consistent frameworks, the scoring remains subjective. This is compounded by the inherent challenges of repeatedly converting qualitative evidence (such as workshop responses or process descriptions) into quantitative data, a process that introduces significant measurement errors and is susceptible to assessor or consultant judgment.\u2022 Framework Interpretation Ambiguity: The NIST Cybersecurity Framework is descriptive, using terms that require broad interpretation (e.g., \"shall be protected\") as opposed to the prescriptive nature of other standards like 800-53. This ambiguity further degrades the consistency and comparability of assessment results.\u2022 Flawed Score Aggregation: The resulting number is often a simple average of maturity ratings across numerous control sub-categories. This averaging technique can mask severe vulnerabilities in a single critical category and provide a misleading picture of overall maturity.\u2022 Benchmark Data Low Quality:","tags":"","seats":""},{"id":"29530","title":"Can LLMs Really Find IDORs? Limits of AI Security Reasoning","type":"Talk","start":"2026-06-01T16:30:00","end":"2026-06-01T17:20:00","date":"2026-06-01","startTime":"16:30","endTime":"17:20","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Vasilii Ermilov","description":"Can AI actually find IDORs in real code? We tested top coding agents against real-world apps\u2014and the results were mixed. The models discovered genuine vulnerabilities, but also generated large numbers of false positives and inconsistent findings. By dissecting results across multiple authorization complexity levels, we show where LLMs shine, where they fail, and why IDORs remain a uniquely hard class of bugs for AI to reason about. Expect real examples, surprising failure modes, and practical lessons for anyone considering AI as a security testing assistant.","tags":"","seats":""},{"id":"29649","title":"The Velocity Paradox: Why More Scanners Lead to Worse Outcomes","type":"Talk","start":"2026-06-01T15:30:00","end":"2026-06-01T15:50:00","date":"2026-06-01","startTime":"15:30","endTime":"15:50","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Francis Ofungwu","description":"Machine-speed output + Human-speed oversight. That's the structural mismatch defining application security in 2026. Security budgets are at record highs, 100% tooling coverage is our never-ending future state, but many organizations are experiencing worse security outcomes. \n\nOur industry's popular narrative says AI-generated code demands more aggressive scanning. This is the wrong framing. The bottleneck isn't coverage, it's organizational context. Traditional tools audit binary nodes (Is MFA on? Is there a hard coded secret?) while ignoring the paths that actually create risk (remember ASPM?). The result is a wall of noise that users have learned to ignore.\n\nIn this talk, I will describe the need for the shift from Pipeline Enforcement, which breaks at velocity, to Contextual Intelligence, which scales with it. By applying Graph Neural Network (GNN) principles as an enrichment layer, we replace binary gates with a relational foundation that surfaces what actually matters.","tags":"","seats":""},{"id":"29652","title":"SameSite... Or Not? Exploring novel bypasses for SameSite cookie protections","type":"Talk","start":"2026-06-01T16:00:00","end":"2026-06-01T16:20:00","date":"2026-06-01","startTime":"16:00","endTime":"16:20","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Vincent Dragnea","description":"SameSite cookies are often relied upon too heavily to prevent cross-site request forgery, yet, due to browser implementations, they can be included in unexpected requests. This talk demonstrates novel bypass techniques, including a Chrome CVE discovered during while researching these methods. Attendees  will gain an understanding of the impacts on real-world applications, and how to protect against these attacks.","tags":"","seats":""},{"id":"29685","title":"When Trust Is Outsourced: Security in the Age of Third-Party Everything","type":"Talk","start":"2026-06-01T16:00:00","end":"2026-06-01T16:20:00","date":"2026-06-01","startTime":"16:00","endTime":"16:20","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Ankan Garg","description":"Most organizations invest heavily in securing their own networks, identities, and endpoints \u2014 yet depend on dozens or hundreds of external vendors to operate day-to-day. In practice, some of the most sensitive data and critical processes live outside the organization\u2019s direct control. Attackers know this and increasingly target third parties, service providers, and support channels as the path of least resistance.\nThis talk draws on real-world risk assessment experience to examine how trust in vendors is established, where it breaks down, and why common assurance mechanisms often fail to reflect actual exposure. Certifications, questionnaires, and contractual clauses can create a sense of comfort, but they do not prevent misconfigurations, credential compromise, insider threats, or cascading failures across interconnected systems.\n\nWe will look at practical scenarios where vendor relationships introduced unexpected risk \u2014 from privileged access and data handling practices to hidden subcontractors and opaque technology stacks. The session will also discuss how emerging dependencies on AI services and automated decision systems complicate accountability and visibility even further.\n\nThe goal is not to criticize vendors, but to provide a realistic framework for evaluating trust in environments where organizations must rely on infrastructure they do not own and cannot fully audit. Attendees will gain practical considerations for identifying high-risk relationships, improving due diligence conversations, and preparing for incidents that originate outside their perimeter.\nThis session is intended for security practitioners, risk professionals, architects, and leaders responsible for safeguarding systems that depend on third-party services.","tags":"","seats":""},{"id":"29703","title":"Why Your Best Detection Tool Is Critical Thinking","type":"Talk","start":"2026-06-01T16:30:00","end":"2026-06-01T16:50:00","date":"2026-06-01","startTime":"16:30","endTime":"16:50","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Klaus Wunder","description":"Every year we get faster tools, better dashboards, and more detections. And every year, analysts still miss things. Not because the tools failed, but because the thinking did.\n\nCybersecurity borrowed heavily from the military: the Kill Chain, MITRE ATT&CK, red teaming, threat intelligence. But we skipped one of the most important things the intelligence community invested in: teaching their analysts how to think. The CIA spent decades studying why smart analysts make bad calls. They built frameworks, published research, and made critical thinking a core discipline. In cybersecurity, we hand someone a SIEM and say good luck.\n\nThis talk explores what happens when we apply intelligence community thinking to cybersecurity analysis. Not academic theory, but practical habits that change how you investigate alerts, assess threats, and make decisions under pressure. Why do analysts anchor on the first hypothesis? Why does confirmation bias turn a routine investigation into a missed breach? And what can you do about it starting Monday morning?\n\nTools change every year. Thinking compounds forever.","tags":"","seats":""},{"id":"29708","title":"A Guide to AI Red Teaming in 2026: Why Traditional Pentest Assumptions Fail","type":"Talk","start":"2026-06-01T15:30:00","end":"2026-06-01T16:20:00","date":"2026-06-01","startTime":"15:30","endTime":"16:20","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Jugal Lad","description":"Organizations are rapidly deploying AI-powered chatbots, copilots, and agentic workflows - often faster than security teams can adapt their testing practices. Traditional pentesting assumes deterministic systems, stable input/output schemas, and well-defined trust boundaries. Those assumptions no longer hold when natural language becomes both the interface and the attack surface, and when models can retrieve data, invoke tools, and trigger real-world actions.\n\nThis session explores AI red teaming as a practical, adaptable, and repeatable application security exercise rather than a collection of one-off jailbreak techniques. We\u2019ll examine where risk actually concentrates in modern AI systems - supporting REST API endpoints, the orchestration layer surrounding LLMs, access controls, input/output handling, and why focusing on the model alone misses the most meaningful exposures, along with a look at real-world cases where attackers have exploited AI-powered functionality to impact businesses.\n\nThrough demonstration of automated testing techniques using open source AI red teaming tools (e.g., Garak, Promptfoo, DeepTeam, etc.) and industry guidance (including the OWASP Top 10 for LLM Applications), attendees will see how ad-hoc experimentation can mature into a repeatable testing approach: structured test matrices, risk-driven evaluation, and findings translated into business impact such as data exposure, unauthorized actions, cost and availability risks, and regulatory or reputational consequences.\n\nThe talk concludes with recommendations for building a layered defense strategy and for integrating continuous AI security testing into existing development workflows. Attendees will leave with a practical mental model for assessing AI risk, communicating it to leadership, and building testing practices that scale alongside rapidly evolving AI deployments","tags":"","seats":""},{"id":"29727","title":"Jailbreak the Jailbreaker: Autonomous AI Red Teaming","type":"Talk","start":"2026-06-01T15:30:00","end":"2026-06-01T15:50:00","date":"2026-06-01","startTime":"15:30","endTime":"15:50","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Mrigakshi Goel","description":"We explore how AI systems can automatically mutate and refine their own prompts to bypass defenses more effectively over time, showing how repeated adversarial testing dramatically increases jailbreak success rates. Through this process, it becomes clear why static guardrails and fixed policy layers quickly collapse when faced with recursive, adaptive probing. Finally, we examine what this means for modern agentic AI systems that have access to tools, APIs, and privileged permissions  and why their expanding capabilities demand a fundamentally different approach to security and oversight.","tags":"","seats":""},{"id":"29755","title":"Losing Context: A Deep Dive into MCP Session Security","type":"Talk","start":"2026-06-01T11:10:00","end":"2026-06-01T11:30:00","date":"2026-06-01","startTime":"11:10","endTime":"11:30","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Srikanth Ramu","description":"Session Access Control - The Missing Validation Layer: The MCP specification explicitly distinguishes sessions from authentication but provides minimal prescriptive guidance on authorization enforcement. This session will explore the theoretical security implications of this design, where session IDs function similarly to bearer tokens but without the typical security controls.The SDK Security Gap: An analysis of current MCP SDK implementations reveals an inconsistency in how session security is handled. While the specification provides various validations, most SDK implementations provide only basic checks, leaving critical validation decisions to developers without clear documentation or guidance.Session Hijacking in MCP - Risks and Mitigations: We will examine how traditional session hijacking attacks apply to MCP's stateful transport model. This includes analyzing attack vectors where unauthorized parties gain access to valid session IDs, the potential impact on server-side resources and data exposure, and practical mitigation strategies. Through architectural examples, we will demonstrate defense-in-depth approaches including session-to-user binding, duplicate connection prevention, session expiration mechanisms, and proper validation patterns that developers can implement regardless of their chosen SDK.","tags":"","seats":""},{"id":"29768","title":"How to get decades-long security in a consumer device: breaking locks and using the courts","type":"Talk","start":"2026-06-01T15:30:00","end":"2026-06-01T15:50:00","date":"2026-06-01","startTime":"15:30","endTime":"15:50","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Denver Gingerich","description":"Consumer devices like phones, routers, and computers are built to last only a few years.  Not because the hardware falls apart, but because, after a few years, manufacturers refuse to update the software.  In most cases they also prevent you from updating the software yourself.  This creates huge amounts of e-waste, and significant added expense for people who would rather keep the perfectly-fine hardware they have.\n\nFortunately, the infosec community is already creating solutions to these problems.  The first step to securing a device long-term is to break the manufacturer's locks so that you can get in and modify the device's software yourself (whether those locks are \"legitimate\" or not).  We have many excellent examples of people prolonging the life of devices this way.\n\nHowever, the majority of the time getting in is just part of the battle.  Once you have root on a device, there may still be software that is proprietary or otherwise difficult to secure (perhaps because the company is withholding source code that they are required to give you).  This is where the software freedom community can help out, by getting all the possible source code, and reimplementing the rest.\n\nWe have many examples where this has been done, from OpenWrt and Rockbox for routers and audio players, to Debian and LineageOS for computers and phones.  In all of these cases, people have found ways to install software updates on devices that would otherwise stop receiving updates, allowing them to continue using their device securely for a decade or more.  And in many cases, these ways involved using the courts.\n\nThis talk will discuss how these projects came to be, how we used the courts to make that happen, how many decades of security support you can reasonably get for an arbitrary consumer device you buy today, and how you can help make this possible.","tags":"","seats":""},{"id":"29771","title":"When the Plan Meets the Incident at Machine Speed: Adapting Police Major Case Management to Cyber Crisis Response","type":"Talk","start":"2026-06-01T11:40:00","end":"2026-06-01T12:30:00","date":"2026-06-01","startTime":"11:40","endTime":"12:30","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Brad Edwards","description":"AI is making attacks faster. Autonomous tooling compresses kill chains that used to take days into hours. Your incident response needs to keep pace, but most organizations have an IRP that covers escalation paths and notification timelines, and nothing that tells you how to actually run the incident at speed.\n\nHow do you brief a room of 30 people at 2 AM? How do you structure teams so nothing falls through the cracks over a 10-day response? How do you make consequential decisions every few minutes under incomplete information without losing accountability? How do you document as you go, rather than reconstructing after the fact? Going faster without answering these questions just leads to confusion faster than ever before.\n\nRCMP Major Case Management was built after investigations failed due to coordination breakdowns under pressure. It provides principles for command structure, information management, team coordination, and accountability that scale from a two-person response to an 80-person operation without the overhead of a full Incident Command System.\n\nThis talk introduces CMIM (Cyber Major Incident Management), an adaptation of those principles for cybersecurity incident response in an era where machine-speed threats demand machine-speed decisions from human teams. It covers what the framework looks like, where it came from, and what happened when it was used to coordinate an 80-person cross-organizational response to a live attack. Bring your IR war stories.","tags":"","seats":""},{"id":"29772","title":"When Reality Becomes Optional: AI Threat Modeling That Actually Works","type":"Talk","start":"2026-06-01T14:30:00","end":"2026-06-01T15:20:00","date":"2026-06-01","startTime":"14:30","endTime":"15:20","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Sebastian Finch; Oliver Stutz","description":"Every security framework tells you to threat model. Almost nobody does it consistently. The reasons are always the same: it's time-consuming, requires specialized expertise, and doesn't scale.\nWe developed an end-to-end AI threat modeling pipeline to address these challenges. Leveraging LLMs through the Model Context Protocol (MCP), our system analyzes architecture diagrams and codebases to generate prioritized, evidence-based threats, including attack vectors, mitigations, and verification steps. This approach delivers consistent results at a pace that enables continuous threat modeling.\nThis presentation will demonstrate the full pipeline, including parsing infrastructure-as-code, extracting architectural patterns, and applying multi-stage reasoning to identify context-aware threats. We will showcase the CLI tool and visualization dashboard, discuss the respective strengths of AI and human expertise, share insights from production deployments, and explain how MCP's architecture supports composable security tooling beyond threat modeling.","tags":"","seats":""},{"id":"29795","title":"Rebooting Resilience: Fixing Burnout Before It Crashes Your System","type":"Talk","start":"2026-06-01T14:30:00","end":"2026-06-01T15:20:00","date":"2026-06-01","startTime":"14:30","endTime":"15:20","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Nicole Che; Leah Liu","description":"In tech, pushing hard is often part of the culture. Tight deadlines, constant change, and the pressure to keep up can make \u201crunning on fumes\u201d feel normal. But when stress stops being temporary and starts feeling relentless, it may be more than just a busy season; it may be burnout.\n\nThis talk breaks down what burnout really is (and what it isn\u2019t), in clear, practical terms. We\u2019ll explore how to recognize the early signs, such as brain fog, loss of motivation, or feeling detached from your work. We\u2019ll also look at why burnout happens in tech environments, including always-on expectations, blurred work-life boundaries, and sustained high-performance demands. The session will also focus on what to do about it.\n\nAttendees will gain realistic strategies for protecting their energy, setting healthier boundaries, and building more sustainable ways of working, both individually and within teams. The goal is not just to manage stress, but to create conditions where people can continue doing meaningful work without burning out.","tags":"","seats":""},{"id":"29804","title":"Evil AI vs. Open Source Linux: Zero competition in the realm of DNS exfiltration","type":"Talk","start":"2026-06-01T13:30:00","end":"2026-06-01T14:20:00","date":"2026-06-01","startTime":"13:30","endTime":"14:20","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Alan Ilicic","description":"In the red corner we have an Evil AI local LLM armed with a client in the right hand and a server in the left.\nHe's notoriously relentless with an unpredictable style fashioning multiple encoding strategies, chunk size tuning and payload throttling.\n\nRecent rumors suggest he's managed to unshackle himself from any external dependencies by leveraging Kotlin Native to execute a standalone binary.\n\nIn the blue corner we have a headless Debian instance ready to unleash a flurry of packages from the standard repos. He's known for being cold and calculated with a unique ability to deeply understand his opponent and counter every move. His defense is impenetrable with unforgiving iptables egress rules and a meticulously configured local DNS stub resolver. Word on the street is he's been training heavy with the DHCP hook to stay fresh on the latest nameserver.\n\nThis is a fight you don't want to miss. Both contenders are highly skilled slaughter machines, unwilling to accept anything less than a knock-out!","tags":"","seats":""},{"id":"29816","title":"Finding the AI Systems No One Approved","type":"Talk","start":"2026-06-01T15:30:00","end":"2026-06-01T15:50:00","date":"2026-06-01","startTime":"15:30","endTime":"15:50","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Giuseppe Trovato","description":"AI is entering enterprises through side doors, not front gates. Long before legal reviews, vendor assessments, or security sign-off, employees are spinning up local coding assistants, connecting to external model servers, and assembling multi-agent workflows that operate entirely outside formal governance.\n\nThis session explores practical agentic fingerprinting, and how security teams can uncover AI systems based on what they are, not what they\u2019re called. By identifying the shared metadata, configuration artifacts, and behavioral signals that define an AI agent, organizations can discover unapproved AI activity across cloud APIs, internal code repositories, and endpoints\u2014without relying on brittle network choke points.\n\nAttendees will leave with a practical framework for mapping their true AI footprint, understanding where governance assumptions break down, and regaining visibility into the digital workforce that is already operating inside their organization\u2014approved or not.","tags":"","seats":""},{"id":"29831","title":"Identity and security lessons learned from securing AI in the cloud; Ten new frameworks for problems we solved twenty years ago","type":"Talk","start":"2026-06-01T16:30:00","end":"2026-06-01T17:20:00","date":"2026-06-01","startTime":"16:30","endTime":"17:20","venue":"Room 1400/1410","venueFulll":"Track 2 - GRC Track - Room 1400/1410 - Sponsored by Iron Spear - Hosted by ISACA","speakers":"Brodie McRae","description":"In an age where everyone wants the positive deterministic benefits of the latest models, and are embracing solutions where AI agents are essentially confused deputies with PhDs and personality disorders, what are some of the lessons we learned in 2006 and how can we help to apply these towards building systems rooted in strong security principles?\n\nThis talk cuts through FUD and marketing. What's new? What isn't? Where's it all headed, and what are the key tenets for real security? Most importantly, what are some hilarious examples of it all going off the rails along the way?","tags":"","seats":""},{"id":"29844","title":"More Legit than Legit: The Threat of Crafted Impersonations","type":"Talk","start":"2026-06-01T17:00:00","end":"2026-06-01T17:20:00","date":"2026-06-01","startTime":"17:00","endTime":"17:20","venue":"Track 5 - Room 1800","venueFulll":"Track 5 - Room 1800","speakers":"Brian Baskin","description":"Modern email attacks do not succeed by looking sneaky. They succeed by being trustworthy. Over the past year, threat actors have gotten better at building organized campaigns with context that holds up even under careful scrutiny. By mimicking legitimate email threads, standing up polished infrastructure, and delivering content that is timely and relevant, they make it harder than ever for a person to tell what is real.\n\nBased on our annual threat report and incidents observed in the wild, this talk examines trust abuse in email that goes beyond typical phishing. It focuses on the techniques attackers use to make their messages feel legitimate including thread hijacking, targeted calendar invites, and professionally impersonated websites.","tags":"","seats":""},{"id":"29845","title":"Building the Local Cybersecurity Community: Meet Up by Meet Up","type":"Panel","start":"2026-06-01T13:30:00","end":"2026-06-01T14:20:00","date":"2026-06-01","startTime":"13:30","endTime":"14:20","venue":"Track 4 - Room 1700","venueFulll":"Track 4 - Room 1700 - Sponsored by Aikido Security","speakers":"Amy Tom; Farshad Abasi; Sarim Khawaja; Ryan Clarke; Penny Longman","description":"As AI-generated content, deepfakes, and automated systems threaten to disrupt trust and replace the human element of security work, one question becomes urgent: what do we actually have left when the machines can do more and more technical work? The answer might be simpler than you think: each other.\n\nMany security professionals try to grow in isolation, building skills, getting certifications, and trying to build their careers without ever looking up to see who\u2019s around them. But building credibility isn\u2019t just about what you know, it\u2019s about showing up consistently and being part of the community, especially when AI is threatening to replace the human element of cybersecurity.\n\nVancouver\u2019s cybersecurity community is proof of the value of connection over competition. Every month, hundreds of security professionals meet in different groups to discuss important topics, build connections, share knowledge, and to support each other.\n\nYou'll hear directly from the organizers behind Vancouver's local meet ups: why they started, what keeps them going, and what it actually takes to build a community worth showing up to. Whether you're a seasoned pro or just finding your footing in the industry, this session will leave you with a clear picture of how to get involved, and why it matters.\n\nIn this session, you\u2019ll learn:\n\n\u2022 What each local meet up community offers and how to find the right fit for you\u2022 Why being part of a security community builds credibility and career resilience in ways that certifications and technical skills alone can't\u2022 How to show up and contribute: even if you're new, introverted, or don't think you have anything to offer yet\u2022 What the tangible benefits of community membership are: mentorship, job opportunities, knowledge sharing, and real human trust\u2022 Concrete next steps to get involved with Vancouver's local cybersecurity meet ups today\n\nPanel Host: Amy Tom, Community Manager at D3 Security","tags":"","seats":""},{"id":"29850","title":"Sandworms and Other Nonsense: An Eventful Year for npm Supply\u2011Chain Attacks","type":"Talk","start":"2026-06-01T10:40:00","end":"2026-06-01T11:30:00","date":"2026-06-01","startTime":"10:40","endTime":"11:30","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Megg Sage","description":"The past year saw an explosion of highly effective malicious\u2011package attacks. Well\u2011known libraries were compromised, new versions shipped with additions for crypto theft or data exfiltration. Attackers launched different attacks with each building upon the last becoming more effective with each iteration. We bore witness to the first appearance of the great sandworm, followed by a far worse second coming. A simple bit of JavaScript that started with a mere 37 packages, swiftly spread like a worm from one victim to the next. In the end, it compromised an estimated 700 packages and GitHub accounts across more than a thousand organizations. Many recognizable companies had source code and other sensitive artifacts stolen. This talk digs into how these campaigns worked, why they were so effective, with real-world examples of how they slipped into even established security vendors or became pivot points for deeper compromise. We\u2019ll also look at what has actually changed to counter this class of threat, what still hasn\u2019t, and what is effective at protecting against these attacks.","tags":"","seats":""},{"id":"29856","title":"Server Side Template Injections For Everyone","type":"Talk","start":"2026-06-01T11:40:00","end":"2026-06-01T12:30:00","date":"2026-06-01","startTime":"11:40","endTime":"12:30","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Wesley Wineberg","description":"Server Side Template Injection (SSTI) is a web vulnerability that can be hard to spot, but leads to critical consequences when exploited.  While this class of vulnerability has been documented for more than a decade, new research is constantly demonstrating that this is not a solved problem.  New techniques for finding and exploiting SSTI vulnerabilities made the #1 spot for the 2025 top web security vulnerability rankings.\n\nThis presentation will cover how to discover SSTI vulnerabilities (even \"blind\" ones), and how these can be exploited to gain full code execution on the underlying server.  No existing knowledge needed, SSTI's for everyone!","tags":"","seats":""},{"id":"29857","title":"Opening Keynote - How cybercriminals are winning with AI, and how we get the advantage back","type":"Keynote","start":"2026-06-01T09:00:00","end":"2026-06-01T10:00:00","date":"2026-06-01","startTime":"09:00","endTime":"10:00","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Shuman Ghosemajumder","description":"Cyber criminals and fraudsters love generative AI even more than businesses and consumers do. For a scammer, hallucinations and errors are features instead of bugs, and they are using AI to flood the web, and every one of our communication channels, with sophisticated fake content. Users are getting fooled and scammed every day, and the problem is only getting worse. This talk will explore why known approaches, such as deepfake detection, email filtering, and security training, haven't stopped misinformation and social engineering, and what we can do about it.","tags":"","seats":""},{"id":"29858","title":"The Coming AI Catastrophe Won't Be Superintelligence, It Will Look Like Malware","type":"Talk","start":"2026-06-01T10:40:00","end":"2026-06-01T11:30:00","date":"2026-06-01","startTime":"10:40","endTime":"11:30","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Geoff McDonald","description":"The most imminent and dangerous AI milestone isn't superintelligence \u2014 it's fully automated, end-to-end ransomware operations and an ai-breakout self-evolving worm. AI risk researchers in academia and industry are missing the importance of this issue. We may have already crossed (or be about to cross) a threshold where AI enables criminal actors to execute enterprise-wide encryption attacks with near-100% automation. The implications are potentially catastrophic: enterprises would need a perfect security posture both externally and internally, which fundamentally challenges how security organizations are structured today.","tags":"","seats":""},{"id":"29859","title":"Beyond Regex: Using LLMs to Add Context to DLP","type":"Talk","start":"2026-06-01T16:00:00","end":"2026-06-01T16:20:00","date":"2026-06-01","startTime":"16:00","endTime":"16:20","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Alex Vazquez","description":"Traditional DLP is great at catching known patterns like SSNs, credit cards, and obvious secrets, but many of today\u2019s most damaging leaks aren\u2019t \u201cpattern-shaped.\u201d They\u2019re high-context artifacts: internal research, design docs, incident notes, and strategy memos that become sensitive because of what they mean and how they combine. In cloud-native collaboration platforms, sharing is frictionless, auditing can lag behind, and \u201cwho accessed what and why\u201d becomes difficult to prove.\n\nTo ground the risk, we\u2019ll start with a real-world case. How a former Google engineer stole thousands of pages of confidential AI trade secrets and uploaded them to a personal cloud account, an example of privileged access plus modern collaboration workflows enabling rapid exfiltration.\n\nFrom there, this talk explores how to use LLMs to add context-aware classification to DLP workflows without turning policy into \u201cwhatever the model says.\u201d We\u2019ll walk through a practical reference architecture: document labeling, confidence scoring and thresholds, human-in-the-loop review, and mapping classifications to enforceable controls like external sharing restrictions, domain allow and deny lists, and step-up authentication. We\u2019ll also cover the hard parts: model inconsistency, prompt injection, drift, and auditability, and the guardrails that make an AI-assisted DLP system safe to operate.","tags":"","seats":""},{"id":"29860","title":"Faces in the Fog: Identifying Users through Unconventional Means","type":"Talk","start":"2026-06-01T14:30:00","end":"2026-06-01T15:20:00","date":"2026-06-01","startTime":"14:30","endTime":"15:20","venue":"Room 1420/1430","venueFulll":"Track 3 - AppSec Track - Room 1420/1430 - Sponsored by Google Cloud Security - Hosted by OWASP","speakers":"Seth Law; Justin Larson","description":"User enumeration remains one of the most prevalent yet under-discussed application security vulnerabilities across industries and organizations worldwide. Despite its critical role in the security landscape, many security teams overlook the implications of this core security flaw.\n\nThis talk will demystify user enumeration by exploring its various types, attack methods, and real-world impact on applications. Attendees will gain practical insights into identifying and mitigating these vulnerabilities with hands-on demonstrations of scripts, tools, and advanced techniques designed for faster detection by utilizing LLM technology. Whether a penetration tester, developer, or security professional, this session will equip you with actionable strategies to strengthen your defenses against user enumeration threats.","tags":"","seats":""},{"id":"29861","title":"Malware then, AI Now: How we engineered our own worst enemy","type":"Malware Village","start":"2026-06-01T09:30:00","end":"2026-06-01T10:00:00","date":"2026-06-01","startTime":"09:30","endTime":"10:00","venue":"Room 1315","venueFulll":"Track 6 - Malware Village - Room 1315","speakers":"Neumann Lim","description":"","tags":"","seats":""},{"id":"29862","title":"KEYNOTE SPEAKER - The AI analysis train is leaving the station: ALL ABOARD!","type":"Keynote","start":"2026-06-01T10:00:00","end":"2026-06-01T11:00:00","date":"2026-06-01","startTime":"10:00","endTime":"11:00","venue":"Room 1315","venueFulll":"Track 6 - Malware Village - Room 1315","speakers":"Ryan J Chapman","description":"","tags":"","seats":""},{"id":"29863","title":"EXPERT PANEL - Starting a Malware hunter career - Experiences from Experts","type":"Malware Village","start":"2026-06-01T11:00:00","end":"2026-06-01T12:00:00","date":"2026-06-01","startTime":"11:00","endTime":"12:00","venue":"Room 1315","venueFulll":"Track 6 - Malware Village - Room 1315","speakers":"Chester Wisniewski; Earl Maynard; Leigh Trinity; Douglas Jose Pereira dos Santos","description":"","tags":"","seats":""},{"id":"29864","title":"Corelight\u2019s Capture the Flag Exercise - Building Skills for Success","type":"Capture The Flag","start":"2026-06-01T09:00:00","end":"2026-06-01T16:30:00","date":"2026-06-01","startTime":"09:00","endTime":"16:30","venue":"Room 1600","venueFulll":"Track 7 - CTF - Room 1600 - Sponsored by Corelight","speakers":"","description":"Overview \nBring your team for an immersive lab-based, instructor-led defensive Capture the Flag exercise with Corelight. Participants will dive into one or more real-world scenarios to detect and respond to threats using logs from Corelight\u2019s Open NDR. \nAgenda \n\n\u25cf Introduction to Zeek: Brief overview of Zeek and its role in network security. Understanding how to leverage Zeek data for threat detection. \n\u25cf Hands-on Hunting: Participants will actively engage in a variety of hunting exercises across different protocols. Use your wits to identify and respond to potential threats discovered in Zeek data. Questions are encouraged, but participants have full control at the keyboard. \n\u25cf Competition and Scoreboard: Participants compete against each other in a friendly competition. Scores will be tracked on a real-time scoreboard. \n\u25cf Debriefing: Discussion on the attacks witnessed during the exercise. Brief overview of how Corelight can enhance threat detection and response capabilities. \n\u25cf Corelight Integration: Learn how Corelight can be integrated into your network defense strategy. Understand the added value Corelight brings to Zeek-powered threat detection. \n\nRequirements \nEach participant will need their own laptop, a standard web browser, and a connection to the Internet. \nContinuing Professional Education (CPE) \n\nParticipants may request a certificate documenting their participation in the Capture the Flag exercise for CPE credits, to help maintain Information Security certifications. \nConclusion \n\nWhether this exercise is administered by your Sales Engineer or as part of a formal Corelight training, participants will build their understanding of the power of Corelight. At the end of the event, participants will not only have honed their threat detection skills but will also have gained insights into leveraging Corelight for effective network defense.","tags":"","seats":""},{"id":"29867","title":"WORKSHOP - Binary Exploitation","type":"Malware Village","start":"2026-06-01T13:30:00","end":"2026-06-01T16:30:00","date":"2026-06-01","startTime":"13:30","endTime":"16:30","venue":"Room 1315","venueFulll":"Track 6 - Malware Village - Room 1315","speakers":"Leigh Trinity","description":"WORKSHOP - Binary Exploitation - Leigh Trinity","tags":"","seats":""},{"id":"29869","title":"The Women in Security Documentary Movie Screening - 30 min","type":"Movie","start":"2026-06-01T12:45:00","end":"2026-06-01T13:20:00","date":"2026-06-01","startTime":"12:45","endTime":"13:20","venue":"Room 1900","venueFulll":"Track 1 - AI Track - Room 1900 - Sponsored by Kobalt.io","speakers":"Penny Longman","description":"The Women in Security Documentary - 30 min version\n\nIn an industry historically dominated by men, \n\nThe WOMEN IN SECURITY Documentary brings to life the often untold stories of women who have shaped \u2014 and continue to reshape \u2014 the landscape of cybersecurity, physical security, intelligence, and protective services.\n\nThrough candid interviews, reenactments of pivotal moments in history, and real-world insights, this documentary shines a light on the resilience, leadership, and innovation that women bring to every part of the security world.\n\nThis film isn\u2019t just about visibility \u2014 it\u2019s about building a future where women aren\u2019t the exception, but the norm.\n\nhttps://www.womeninsecuritydocumentary.com/","tags":"","seats":""}]
;

const TYPE_COLORS = {
  'Keynote':       '#ffd740',
  'Talk':          '#00e5ff',
  'Workshop':      '#a6ff4d',
  'Panel':         '#ce93d8',
  'Capture The Flag': '#ff6e40',
  'Malware Village':'#ff3d6b',
  'Movie':         '#80cbc4',
};

function typeColor(t) { return TYPE_COLORS[t] || '#90a4ae'; }

let saved = new Set(JSON.parse(localStorage.getItem('bsyvr26') || '[]'));
let activeType = 'all';
let expandedId = null;
let showingMySchedule = false;

function saveState() {
  localStorage.setItem('bsyvr26', JSON.stringify([...saved]));
  document.getElementById('savedCount').textContent = saved.size;
  document.getElementById('mySchedBtn').querySelector('.count').textContent = saved.size;
}

function toggleSaved(id, e) {
  e.stopPropagation();
  if (saved.has(id)) { saved.delete(id); } else { saved.add(id); }
  saveState();
  render();
  if (showingMySchedule) renderMySchedule();
}

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  render();
  if (showingMySchedule) renderMySchedule();
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-CA', { weekday:'long', month:'long', day:'numeric' });
}

function buildCard(s, inMySchedule) {
  const isSaved = saved.has(s.id);
  const isExp = expandedId === s.id;
  const col = typeColor(s.type);
  return `<div class="card${isSaved?' saved':''}${isExp?' expanded':''}" onclick="toggleExpand('${s.id}')" id="card-${s.id}" style="border-left-color:${col}20">
    <div class="card-meta">
      <span class="type-badge" style="background:${col}22;color:${col};border:1px solid ${col}44">${s.type}</span>
      <span class="time-badge">${s.startTime}–${s.endTime}</span>
      <span class="venue-badge">${s.venue}</span>
      ${s.seats ? `<span class="card-seats">⚠ ${s.seats} seats</span>` : ''}
    </div>
    <div class="card-header">
      <div class="card-title">${s.title}</div>
      <button class="save-btn" onclick="toggleSaved('${s.id}',event)" title="${isSaved?'Remove from':'Add to'} schedule">${isSaved?'★':'☆'}</button>
    </div>
    ${s.speakers ? `<div class="card-speakers">${s.speakers}</div>` : ''}
    ${s.description ? `<div class="card-desc">${s.description.replace(/\n/g,'<br>')}</div>` : ''}
  </div>`;
}

function groupByTime(sessions) {
  const groups = {};
  sessions.forEach(s => {
    const key = s.date + '|' + s.startTime;
    if (!groups[key]) groups[key] = { date: s.date, time: s.startTime, sessions: [] };
    groups[key].sessions.push(s);
  });
  return Object.values(groups).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = SESSIONS.filter(s => {
    if (activeType !== 'all' && s.type !== activeType) return false;
    if (q) {
      const hay = (s.title + ' ' + s.speakers + ' ' + s.description + ' ' + s.venue).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderFiltered(filtered);
}

function renderFiltered(sessions) {
  const groups = groupByTime(sessions);
  let html = '';
  let lastDate = null;

  groups.forEach(g => {
    if (g.date !== lastDate) {
      html += `<div class="date-header">${fmtDate(g.date)}</div>`;
      lastDate = g.date;
    }
    html += `<div class="time-group">
      <div class="time-label">${g.time}</div>
      ${g.sessions.map(s => buildCard(s)).join('')}
    </div>`;
  });

  document.getElementById('sessionList').innerHTML = html || '<div class="empty-state"><div class="big">∅</div><div>No sessions match your filters.</div></div>';
  document.getElementById('resultInfo').textContent = `${sessions.length} session${sessions.length!==1?'s':''} shown`;
}

function render() {
  if (!showingMySchedule) applyFilters();
}

function buildTypePills() {
  const TYPE_ORDER = ['Talk','Keynote','Malware Village','Capture The Flag','Panel','Movie'];
  const present = new Set(SESSIONS.map(s => s.type));
  const types = [...TYPE_ORDER.filter(t => present.has(t)), ...[...present].filter(t => !TYPE_ORDER.includes(t)).sort()];
  const wrap = document.getElementById('typePills');
  wrap.innerHTML = `<button class="pill active" data-type="all" onclick="setType('all',this)">All Types</button>` +
    types.map(t => `<button class="pill" data-type="${t}" onclick="setType('${t}',this)" style="--tc:${typeColor(t)}">${t}</button>`).join('');
}


function setType(t, el) {
  activeType = t;
  document.querySelectorAll('#typePills .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function detectConflicts(sessions) {
  const conflicts = [];
  for (let i = 0; i < sessions.length; i++) {
    for (let j = i+1; j < sessions.length; j++) {
      const a = sessions[i], b = sessions[j];
      if (a.date !== b.date) continue;
      if (a.start < b.end && b.start < a.end) conflicts.push([a.title, b.title]);
    }
  }
  return conflicts;
}

function renderMySchedule() {
  const mySessions = SESSIONS.filter(s => saved.has(s.id))
    .sort((a,b) => a.start.localeCompare(b.start));

  const el = document.getElementById('myScheduleContent');
  if (mySessions.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big">📋</div><div>No sessions saved yet.</div><div style="margin-top:8px;font-size:12px">Hit ☆ on any session to add it to your schedule.</div></div>`;
    return;
  }

  const conflicts = detectConflicts(mySessions);
  let html = '';
  if (conflicts.length > 0) {
    html += `<div class="conflict-warn">⚠ Schedule conflict detected: ${conflicts.map(c=>`"${c[0]}" overlaps with "${c[1]}"`).join(' | ')}</div>`;
  }

  let lastDate = null;
  mySessions.forEach(s => {
    if (s.date !== lastDate) {
      html += `<div class="date-header">${fmtDate(s.date)}</div>`;
      lastDate = s.date;
    }
    html += buildCard(s, true);
  });
  el.innerHTML = html;
}

function toggleMySchedule() {
  showingMySchedule = !showingMySchedule;
  document.getElementById('schedule-view').style.display = showingMySchedule ? 'none' : '';
  const panel = document.getElementById('my-schedule-panel');
  panel.classList.toggle('visible', showingMySchedule);
  document.getElementById('mySchedBtn').classList.toggle('active', showingMySchedule);
  if (showingMySchedule) renderMySchedule();
}

// Init
saveState();
buildTypePills();
applyFilters();
</script>
</body>
</html>
